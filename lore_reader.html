<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Games - Lore Codex</title>
    <link rel="icon" type="image/png" href="assets/sprites/danger_ghost_icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--bg-dark);
            color: var(--white);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at center, rgba(13, 13, 16, 0.8) 0%, #070708 100%);
        }
        
        /* Reader Layout */
        #reader-sidebar {
            width: 300px;
            background: rgba(10, 10, 14, 0.85);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        #reader-content-area {
            flex-grow: 1;
            padding: 40px 80px;
            overflow-y: auto;
            position: relative;
        }

        /* Sidebar Elements */
        .reader-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .reader-header h1 {
            font-family: var(--font-title);
            font-size: 24px;
            color: var(--cyan-neon);
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            margin: 0;
        }

        .reader-header p {
            font-family: var(--font-text);
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .toc-item {
            margin-bottom: 10px;
        }

        .toc-btn {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            border-left: 2px solid transparent;
            color: var(--white);
            text-align: left;
            padding: 12px 15px;
            font-family: var(--font-text);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toc-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-left-color: var(--magenta-neon);
        }

        .toc-btn.active {
            background: rgba(0, 255, 255, 0.1);
            border-left-color: var(--cyan-neon);
            color: var(--cyan-neon);
            font-weight: 600;
        }

        .audiobook-controls {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            padding: 10px;
            cursor: pointer;
            font-family: var(--font-title);
            transition: all 0.2s;
            border-radius: 4px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
        }

        /* Typography inside Content */
        .content-container {
            max-width: 800px;
            margin: 0 auto;
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
            line-height: 1.8;
            color: #dddddd;
            padding-bottom: 100px;
        }

        .content-container h2 {
            font-family: var(--font-title);
            font-size: 36px;
            color: var(--white);
            margin-bottom: 40px;
            border-bottom: 2px solid var(--cyan-neon);
            padding-bottom: 10px;
        }

        .content-container h3 {
            font-family: var(--font-title);
            font-size: 24px;
            color: var(--magenta-neon);
            margin-top: 40px;
        }

        .content-container p {
            margin-bottom: 24px;
        }

        .content-container em {
            color: var(--yellow-neon);
            font-style: italic;
        }

        /* Responsivo: em telas estreitas, empilha a barra lateral em cima do
           texto em vez de espremer os dois lado a lado (a sidebar fixa de
           300px + o padding de 80px do conteúdo não cabem em ~375px). */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }

            #reader-sidebar {
                width: 100%;
                box-sizing: border-box;
                border-right: none;
                border-bottom: 1px solid var(--border-light);
                max-height: 60vh;
                overflow-y: auto;
            }

            /* Sem isso, o flex-grow:1 original espreme a lista de capítulos
               quase a zero de altura dentro da sidebar limitada acima —
               achei esse bug testando no navegador antes de considerar
               pronto. Dá uma altura garantida e visível, com scroll próprio
               se a lista de capítulos crescer. */
            .toc-list {
                flex-grow: 0;
                max-height: 140px;
                overflow-y: auto;
            }

            #reader-content-area {
                padding: 24px 20px 60px;
            }

            .content-container {
                font-size: 17px;
            }

            .content-container h2 {
                font-size: 26px;
                margin-bottom: 24px;
            }
        }
    </style>
</head>
<body>

    <div id="reader-sidebar">
        <div class="reader-header">
            <h1>LORE CODEX</h1>
            <p>Danger Ghost Universe</p>
        </div>

        <ul class="toc-list" id="tocList">
            <li class="toc-item"><button class="toc-btn active" onclick="loadChapter('vol1')">Volume 1: The Great Enlightenment</button></li>
            <li class="toc-item"><button class="toc-btn" onclick="loadChapter('vol2')">Volume 2: The Roar of the Rift</button></li>
        </ul>

        <div class="audiobook-controls">
            <button class="cyber-btn primary" onclick="toggleAudiobook('en-US')" id="audioBtnEN" style="padding: 12px; font-size: 14px; margin-bottom: 5px;">
                <span class="btn-icon" id="audioIconEN">🔊</span>
                <span class="btn-text" id="audioBtnTextEN">Play Audiobook (EN)</span>
            </button>
            <button class="cyber-btn primary" onclick="toggleAudiobook('pt-BR')" id="audioBtnPT" style="padding: 12px; font-size: 14px; margin-bottom: 5px;">
                <span class="btn-icon" id="audioIconPT">🔊</span>
                <span class="btn-text" id="audioBtnTextPT">Play Audiobook (PT-BR)</span>
            </button>

            <button class="back-btn" onclick="window.location.href='index.html'">Return to Game</button>
        </div>
    </div>

    <div id="reader-content-area">
        <div class="content-container" id="textContent">
            <h2>Initializing Neural Link...</h2>
            <p>Loading archival records from the Blockchain. Please wait.</p>
        </div>
    </div>

    <script src="js/lore_data.js"></script>
    <script>
        let currentChapter = 'vol1';
        let isPlaying = false;
        let isPaused = false;
        let playingLang = 'en-US';
        let synth = window.speechSynthesis;
        let currentUtterance = null;
        let sentenceQueue = [];

        function loadChapter(chapterId) {
            // Update TOC active state
            document.querySelectorAll('.toc-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            currentChapter = chapterId;
            updateContentDisplay();

            // Stop audio if playing
            if (isPlaying) {
                stopAudiobook();
            }
        }

        function updateContentDisplay() {
            let langSuffix = playingLang === 'pt-BR' ? '_pt' : '_en';
            let contentKey = currentChapter + langSuffix;
            if (loreData[contentKey]) {
                document.getElementById('textContent').innerHTML = loreData[contentKey];
                document.getElementById('reader-content-area').scrollTop = 0;
            }
        }

        function toggleAudiobook(langCode) {
            if (!('speechSynthesis' in window)) {
                alert("Your browser does not support text-to-speech.");
                return;
            }

            if (isPlaying) {
                if (playingLang === langCode) {
                    // Toggle pause/resume for the current language
                    if (isPaused) {
                        synth.resume();
                        isPaused = false;
                    } else {
                        synth.pause();
                        isPaused = true;
                    }
                    updateAudioBtnUI();
                } else {
                    // Clicked a different language, switch to it
                    stopAudiobook();
                    setTimeout(() => playAudiobook(langCode), 200);
                }
            } else {
                playAudiobook(langCode);
            }
        }

        function playAudiobook(langCode) {
            isPlaying = true;
            isPaused = false;
            playingLang = langCode;
            updateContentDisplay(); // Switch text language to match audio

            const container = document.getElementById('textContent');
            const rawText = container.innerText || container.textContent;
            
            // Chunk by sentences to prevent browser TTS character limits
            sentenceQueue = rawText.match(/[^.!?\n]+[.!?\n]+/g) || [rawText];
            sentenceQueue = sentenceQueue.map(s => s.trim()).filter(s => s.length > 0);
            
            isPlaying = true;
            playingLang = langCode;
            updateAudioBtnUI();
            
            speakNextChunk();
        }

        function speakNextChunk() {
            if (!isPlaying || sentenceQueue.length === 0) {
                stopAudiobook();
                return;
            }
            
            let text = sentenceQueue.shift();
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = playingLang; 
            currentUtterance.rate = 0.95; // Slightly slower for epic storytelling
            currentUtterance.pitch = 0.9;
            
            currentUtterance.onend = () => {
                if (isPlaying) speakNextChunk();
            };
            
            currentUtterance.onerror = (e) => {
                console.error("Speech Synthesis Error", e);
                // Try moving to next chunk instead of completely stopping
                if (isPlaying) speakNextChunk();
            };

            synth.speak(currentUtterance);
        }

        function stopAudiobook() {
            isPlaying = false;
            isPaused = false;
            sentenceQueue = [];
            if (synth.speaking) {
                synth.cancel();
            }
            updateAudioBtnUI();
        }

        function updateAudioBtnUI() {
            const btnTextEN = document.getElementById('audioBtnTextEN');
            const btnTextPT = document.getElementById('audioBtnTextPT');
            const iconEN = document.getElementById('audioIconEN');
            const iconPT = document.getElementById('audioIconPT');

            
            if (isPlaying && playingLang === 'en-US') {
                btnTextEN.innerText = isPaused ? "Resume Audiobook (EN)" : "Pause Audiobook (EN)";
                iconEN.innerText = isPaused ? "▶️" : "⏸";
            } else {
                btnTextEN.innerText = "Play Audiobook (EN)";
                iconEN.innerText = "🔊";
            }

            if (isPlaying && playingLang === 'pt-BR') {
                btnTextPT.innerText = isPaused ? "Resume Audiobook (PT-BR)" : "Pause Audiobook (PT-BR)";
                iconPT.innerText = isPaused ? "▶️" : "⏸";
            } else {
                btnTextPT.innerText = "Play Audiobook (PT-BR)";
                iconPT.innerText = "🔊";
            }
        }

        // Init
        window.onload = () => {
            updateContentDisplay();
        };

        // Stop audio when leaving the page
        window.addEventListener('beforeunload', () => {
            if (synth.speaking) synth.cancel();
        });
    </script>
</body>
</html>
