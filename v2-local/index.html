<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Danger Ghost v2.0 | Immersive Fullscreen</title>\n    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <!-- Fontes do Sistema de Design (Acessibilidade) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Scripts Externos -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="js/core/event_bus.js"></script>
    <script src="js/globals.js"></script>
    <script src="js/web3/deso_api.js"></script>
    <script src="rpg_system.js"></script>
    <script src="js/ui/ui_manager.js"></script>
</head>
<body>
    <iframe id="identityIframe" src="https://identity.deso.org/embed?v=2" style="display: none;"></iframe>

    <!-- Container Principal do Viewport -->
    <div id="gameViewport">
        <!-- Canvas Principal do Jogo (Ocupa 100% da tela ou escalonado com Letterbox) -->
        <canvas id="myCanvas" width="640" height="300"></canvas>
        <img id="cutsceneGif" src="assets/sprites/Dream 36.gif" style="display: none;" />

        <!-- HUD Superior Minimalista e Flutuante (In-Game) -->
        <div id="gameHUD" class="hud-container">
            <div class="hud-left">
                <span id="hudLevel">LVL: 1</span>
                <div class="bar-container hp-bar-bg"><div id="hudHP" class="bar-fill hp-bar"></div></div>
                <div class="bar-container mp-bar-bg"><div id="hudMP" class="bar-fill mp-bar"></div></div>
            </div>
            
            <div class="hud-center">
                <h1 class="hud-title">DANGER GHOST</h1>
            </div>

            <div class="hud-right">
                <button id="hudBtnControls" class="hud-tab-btn" onclick="ToggleNavbarTab('controls')">🎮</button>
                <button id="hudBtnRPG" class="hud-tab-btn" onclick="ToggleNavbarTab('rpg')">👤</button>
                <button id="hudBtnBag" class="hud-tab-btn" onclick="ToggleNavbarTab('bag')">🎒</button>
                <button id="hudBtnEquip" class="hud-tab-btn" onclick="ToggleNavbarTab('equip')">🛡️</button>
                <button id="hudBtnChat" class="hud-tab-btn" onclick="ToggleNavbarTab('chat')">💬</button>
                <button id="hudMuteBtn" class="hud-tab-btn" onclick="ToggleMute()">🔊</button>
                <button id="hudFullscreenBtn" class="hud-tab-btn" onclick="ToggleFullscreen()">⛶</button>
            </div>
        </div>

        <!-- Overlays de Interface Flutuantes (Z-Index: 100) -->
        <!-- Painel Esquerdo (RPG & Status) -->
        <div id="rpgPanel" class="overlay-panel panel-left" style="display: none;">
            <div id="rpgPanelContent"></div>
        </div>

        <!-- Painel de Chat (Esquerda) -->
        <div id="chatPanel" class="overlay-panel panel-left" style="display: none;">
            <h3 class="panel-header">💬 GLOBAL CHAT</h3>
            <div class="chat-nick-row">
                <span>NICK:</span>
                <input type="text" id="chatNickInput" placeholder="GUEST_GHOST" />
            </div>
            <div id="chatMessages" class="chat-log"></div>
            <div class="chat-input-row">
                <input type="text" id="chatMsgInput" placeholder="TYPE MESSAGE..." />
                <button id="chatSendBtn">SEND</button>
            </div>
        </div>

        <!-- Painel Direito (Bag, Equipamentos, Controles, Leaderboard) -->
        <div id="navbarPanel" class="overlay-panel panel-right" style="display: none;">
            <div id="navbarPanelContent"></div>
        </div>

        <!-- Overlay de Seleção de Personagem (Z-Index: 300) -->
        <div id="characterSelectionOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8, 6, 12, 0.95); z-index: 1000; overflow-y: auto; font-family: 'Courier New', monospace; color: #FFF; text-align: center; padding: 40px 20px; box-sizing: border-box;">
            <div style="max-width: 800px; margin: 0 auto;">
                <h2 style="color: #00FF00; letter-spacing: 2px; text-shadow: 0 0 10px #00FF00; margin-bottom: 30px;">👻 🎮 SELECT YOUR GHOST</h2>
                
                <div id="characterCardsContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 40px;">
                </div>
                
                <div style="background: rgba(255, 255, 255, 0.05); border: 2px dashed rgba(0, 255, 255, 0.3); border-radius: 8px; padding: 25px; margin-bottom: 20px;">
                    <h3 style="color: #00FFFF; margin: 0 0 10px 0;">CREATE NEW GHOST</h3>
                    <p id="newGhostPriceText" style="color: #AAA; font-size: 13px; margin: 0 0 15px 0;">Your first Ghost is 100% free (only pay DeSo network fees).</p>
                    <button id="createGhostBtn" onclick="TriggerCreateNewGhost()" style="padding: 10px 25px; background: #00FF00; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; outline: none; transition: all 0.15s ease;" onmouseover="this.style.boxShadow='0 0 15px #00FF00'" onmouseout="this.style.boxShadow='none'">CREATE NEW GHOST (MINT)</button>
                </div>
                
                <div style="margin-top: 15px;">
                    <button onclick="CancelCharacterSelection()" style="padding: 10px 25px; background: #FF00FF; color: #FFF; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; outline: none; transition: all 0.15s ease;" onmouseover="this.style.boxShadow='0 0 15px #FF00FF'" onmouseout="this.style.boxShadow='none'">CANCEL / CLOSE</button>
                </div>
            </div>
        </div>

        <!-- Menu Inicial Imersivo (Z-Index: 400) -->
        <div id="mainMenuOverlay" class="modal-overlay immersive-menu">
            <!-- Efeito de Grid 3D de fundo -->
            <div class="particles-bg"></div>
            
            <div class="menu-content-wrapper">
                <div class="title-container">
                    <h1 class="menu-title glitched" data-text="DANGER GHOST">DANGER GHOST</h1>
                    <p class="menu-subtitle cyber-text">v2.0 // NOWHERE IMMERSION</p>
                </div>
                
                <div class="menu-actions">
                    <!-- PLAY GAME -->
                    <button onclick="StartGameFromMenu()" class="cyber-btn primary">
                        <span class="btn-content">
                            <span class="btn-icon">▶</span>
                            <span class="btn-text">INITIALIZE_LINK</span>
                        </span>
                    </button>
                    
                    <!-- SELECT CHARACTER removido (agora é automático pelo fluxo de auth) -->
                    
                    <!-- LORE & CODEX -->
                    <button onclick="OpenCodexMenu()" class="cyber-btn tertiary">
                        <span class="btn-content">
                            <span class="btn-icon">▤</span>
                            <span class="btn-text">ACCESS_ARCHIVES</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de inicialização da Engine -->
    <script src="js/game/engine.js"></script>
</body>
</html>
